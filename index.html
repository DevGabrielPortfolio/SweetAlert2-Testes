<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.all.min.js" defer></script>
    
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.min.css" rel="stylesheet">
    
    <script src="./assets/js/index.js" defer></script>

    <title>SweetAlert2 - testes</title>
</head>
<body>
    <div class="container mt-5">

        <h1 class="text-center mb-4">Demonstração dos SweetAlert2</h1>

        <div class="row">

            <!--Card 1: Alerta Básico-->
            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-header">Alerta Básico</div>

                    <div class="card-body text-center">

                        <button id="alertBasico" class="btn btn-secondary">Exibir Alerta Básico</button>

                    </div><!--card-body text-center-->

                </div><!--card-->

            </div><!--col-md-4 mb-3-->

            <!--Card 2: Alerta de Sucesso-->
            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-header">Alerta de Sucesso</div>

                    <div class="card-body text-center">

                        <button id="alertSucesso" class="btn btn-success">Exibir Alerta de Sucesso</button>

                    </div><!--card-body text-center-->

                </div><!--card-->

            </div><!--col-md-4 mb-3-->

            <!--Card 3: Alerta de Erro-->
            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-header">Alerta de Erro</div>

                    <div class="card-body text-center">

                        <button id="alertErro" class="btn btn-danger">Exibir Alerta de Erro</button>

                    </div><!--card-body text-center-->

                </div><!--card-->

            </div><!--col-md-4 mb-3-->

            <!--Card 4: Alerta de Aviso-->
            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-header">Alerta de Aviso</div>

                    <div class="card-body text-center">

                        <button id="alertAviso" class="btn btn-warning">Exibir Alerta de Aviso</button>

                    </div><!--card-body text-center-->

                </div><!--card-->

            </div><!--col-md-4 mb-3-->

            <!--Card 5: Alerta de informação-->
            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-header">Alerta Informativo</div>

                    <div class="card-body text-center">

                        <button id="alertInfo" class="btn btn-info">Exibir Alerta de Informação</button>

                    </div><!--card-body text-center-->

                </div><!--card-->

            </div><!--col-md-4 mb-3-->

            <!--Card 6: Alerta de Confirmação-->
            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-header">Alerta de Confirmação</div>

                    <div class="card-body text-center">

                        <button id="alertConirm" class="btn btn-primary">Exibir Alerta de Confirmação</button>

                    </div><!--card-body text-center-->

                </div><!--card-->

            </div><!--col-md-4 mb-3-->

            <!--Card 7: Alerta com input-->
            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-header">Alerta com Input</div>

                    <div class="card-body text-center">

                        <button id="alertInput" class="btn btn-dark">Exibir Prompt</button>

                    </div><!--card-body text-center-->

                </div><!--card-->

            </div><!--col-md-4 mb-3-->

            <!--Card 8: Alerta com timer-->
            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-header">Alerta com Timer</div>

                    <div class="card-body text-center">

                        <button id="alertTimer" class="btn btn-outline-primary">Exibir com Timer</button>

                    </div><!--card-body text-center-->

                </div><!--card-->

            </div><!--col-md-4 mb-3-->

            <!--Card 9: Alerta com HTML-->
            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-header">Alerta com HTML</div>

                    <div class="card-body text-center">

                        <button id="alertHtml" class="btn btn-outline-secondary">Exibir HTML</button>

                    </div><!--card-body text-center-->

                </div><!--card-->

            </div><!--col-md-4 mb-3-->

        </div><!--row-->

    </div><!--container mt-5-->
</body>
</html>
